[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-studio-licheski-mcp"
version = "0.1.0"
description = "FL Studio Licheski MCP: drive FL Studio as a full production rig (instruments, tempo, live arrangement playback, loop rendering) from an AI assistant"
requires-python = ">=3.10"
authors = [{ name = "Guilherme Licheski" }]
dependencies = [
    "fastmcp>=2.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "soundcard>=0.4.3",
    "numpy>=1.26",
]

[project.scripts]
fl-licheski-mcp = "fl_licheski_mcp.server:main"
fl-licheski-install = "fl_licheski_mcp.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_licheski_mcp"]
